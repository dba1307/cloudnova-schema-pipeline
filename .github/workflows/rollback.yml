name: Rollback (manual, approved)
on:
  workflow_dispatch:
    inputs:
      github_environment: { description: "Environment", type: choice, options: [staging, production-canary, production-us-east-1, production-ap-southeast-1] }
      steps: { description: "How many migrations to revert", default: "1" }
      reason: { description: "Incident / ticket reference", required: true }
permissions: { contents: read, id-token: write }
concurrency: { group: db-rollout, cancel-in-progress: false }   # shares the lock with deploys
jobs:
  rollback:
    runs-on: ${{ vars.TARGET_MODE == 'aws' && 'vpc-runners' || 'ubuntu-latest' }}
    environment: ${{ inputs.github_environment }}
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: cloudnova }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Assume this environment role (OIDC, no long-lived keys)
        if: vars.TARGET_MODE == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "${{ vars.AWS_ROLE_ARN }}"
          aws-region: "${{ vars.AWS_REGION }}"
      - name: Roll back (refuses migrations that have no .down.sql)
        env:
          TARGET_MODE: ${{ vars.TARGET_MODE || 'demo' }}
          DB_HOST: ${{ vars.DB_HOST }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          RDS_CA_BUNDLE: ${{ vars.RDS_CA_BUNDLE }}
          ROLLBACK_STEPS: ${{ inputs.steps }}
          ROLLBACK_REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          if ! [[ "$ROLLBACK_STEPS" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::steps must be a positive integer (got: '$ROLLBACK_STEPS')"
            exit 1
          fi
          printf 'reason: %s\n' "$ROLLBACK_REASON"
          if [[ "$TARGET_MODE" == "aws" ]]; then
            : "${DB_HOST:?}" "${AWS_REGION:?}"
            export PGHOST="$DB_HOST" PGPORT=5432 PGUSER=migrator PGDATABASE=cloudnova PGSSLMODE=verify-full PGSSLROOTCERT="${RDS_CA_BUNDLE:?}"
            PGPASSWORD="$(aws rds generate-db-auth-token --hostname "$DB_HOST" --port 5432 --region "$AWS_REGION" --username migrator)"; export PGPASSWORD
          else
            export PGHOST=localhost PGPORT=5432 PGDATABASE=cloudnova
            PGUSER=postgres PGPASSWORD=postgres psql -X -q -v ON_ERROR_STOP=1 -f db/bootstrap/roles.sql -c "ALTER ROLE migrator PASSWORD 'ci-only'"
            export PGUSER=migrator PGPASSWORD=ci-only
            python3 tools/migrate.py up          # demo only: put the ephemeral container at head so there is something to revert
          fi
          python3 tools/migrate.py down --steps "$ROLLBACK_STEPS"
          python3 tools/verify.py
