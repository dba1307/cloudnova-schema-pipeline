name: Rollback (manual, approved)
on:
  workflow_dispatch:
    inputs:
      github_environment: { description: "Environment", type: choice, options: [staging, production-canary, production-us-east-1, production-ap-southeast-1] }
      steps: { description: "How many migrations to revert", default: "1" }
      reason: { description: "Incident / ticket reference", required: true }
permissions: { contents: read, id-token: write }
concurrency: { group: db-rollout, cancel-in-progress: false }   # shares the lock with deploys
jobs:
  rollback:
    runs-on: ${{ vars.TARGET_MODE == 'aws' && 'vpc-runners' || 'ubuntu-latest' }}
    environment: ${{ inputs.github_environment }}
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: cloudnova }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
